{% extends 'base.html' %} {% block content %}
<div class="container border border-warning bg-light w-75 my-5 py-3">
  <div class="row">
    <div class="col-8">
      <div class="row py-2">
        <h5 style="display: none;" class="text-center msg">This is message space</h5>
        <div class="col mt-2">
          <input
            type="text"
            class="form-control"
            id="fname"
            placeholder="First name"
          />
        </div>
        <div class="col mt-2">
          <input
            type="text"
            class="form-control"
            id="lname"
            placeholder="Last name"
          />
        </div>
      </div>
      <div class="form-group py-2">
        <!-- <label for="exampleInputEmail1">Email address</label> -->
        <input
          type="email"
          class="form-control email"
          id="exampleInputEmail1"
          aria-describedby="emailHelp"
          placeholder="Enter email"
        />
      </div>
      <div class="form-group py-2">
        <!-- <label for="exampleInputPassword1">Password</label> -->
        <input
          type="password"
          class="form-control password"
          id="exampleInputPassword1"
          placeholder="Password"
        />
      </div>

      <div class="form-group py-2">
        <input
          type="password"
          class="form-control cpassword"
          id="exampleInputPassword1"
          placeholder="Confirm Password"
        />
      </div>
      <div class="form-check">
        <input
          type="checkbox"
          class="form-check-input checkbox"
          id="exampleCheck1"
        />
        <label class="form-check-label" for="exampleCheck1"
          >Show Password</label
        >
      </div>
      <div class="form-group py-2">
        <!-- <label for="exampleInputPassword1">Pincode</label> -->
        <input
          type="text"
          class="form-control pincode"
          id="exampleInputPassword1"
          placeholder="Pincode"
        />
      </div>
      <button type="submit" class="btn btn-primary px-5" id="registrationBtn">
        Sign Up
      </button>
    </div>
    <div class="col-4">This is for gmail login</div>
  </div>
</div>
{% endblock%}

{% extends 'base.html' %}
{% block content %}

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-body p-4">

          <h4 class="text-center mb-4">Create Account</h4>

          <h5 class="text-center text-danger msg d-none"></h5>

          <!-- First + Last Name -->
          <div class="row mb-3">
            <div class="col">
              <input type="text" class="form-control" id="fname" placeholder="First name">
            </div>
            <div class="col">
              <input type="text" class="form-control" id="lname" placeholder="Last name">
            </div>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <input type="email" class="form-control email" placeholder="Enter email">
          </div>

          <!-- Password -->
          <div class="mb-3">
            <input type="password" class="form-control password" placeholder="Password">
          </div>

          <!-- Confirm Password -->
          <div class="mb-3">
            <input type="password" class="form-control cpassword" placeholder="Confirm Password">
          </div>

          <!-- Show Password -->
          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input checkbox" id="showPassword">
            <label class="form-check-label" for="showPassword">Show Password</label>
          </div>

          <!-- Phone -->
          <div class="mb-3">
            <input type="text" class="form-control phone" placeholder="Contact number">
          </div>

          <!-- Sign Up Button -->
          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary" id="registrationBtn">
              Sign Up
            </button>
          </div>

          <!-- Divider -->
          <div class="text-center mb-3">
            <span class="text-muted">OR</span>
          </div>

          <!-- Google Button -->
          <div class="d-grid">
            <a href="{{ url_for('login_google') }}"
               class="btn btn-light border d-flex align-items-center justify-content-center">
              <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                   width="20"
                   class="me-2">
              Continue with Google
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>

{% endblock %}

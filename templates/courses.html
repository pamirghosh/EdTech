{% extends "base.html" %}

{% block content %}
    <!-- Courses section -->
    <section class="py-5" id="courses">
      <div class="container border border-warning bg-white rounded-2">
        <h3 class="text-center mt-5">Our Courses</h3>
        <div class="row m-3 p-3 d-flex justify-content-center pb-5">
          {% for course in courses %}
          <div class="card m-2 course" style="width: 18rem">
            <img src="/static/images/{{course['image']}}" class="card-img-top" alt="..." />
            <div class="card-body d-flex flex-column">
              <p class="hidden id" style="display: none;">{{course['id']}}</p>
              <h5 class="card-title">{{course['title']}}</h5>
              <p class="card-text">
                {{course['details']}}
              </p>
              <div class="mt-auto">
              <a href="#" class="btn btn-warning px-4">Buy</a>
              <a href="#" class="btn btn-warning">Add to cart</a>
              </div>
            </div>
          </div>
          {% endfor %}
          </div>
        </div>
    </section>
    
    {% include "about.html" %}
    {% include "contact.html" %}
{% endblock %}

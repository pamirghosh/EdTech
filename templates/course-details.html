{% extends "base.html" %}
{% block content %}
<!-- {{course_data}} -->
<div class="d-flex justify-content-center align-items-center m-5 border border-warning p-3">
  
  <div class="container">
    
    <div class="row align-items-center">
      <div class="col-6 ">
        <img src="/static/images/{{course_data['image']}}" class="img-fluid" alt="">
      </div>

      <div class="col-6 ">
        <h3>{{course_data['title']}}</h3>
        <p>
        <input type="text" readonly class="form-control-plaintext" id="staticEmail" value="{{course_data['details']}}">
        </p>
        <p><input type="text" readonly class="form-control-plaintext" id="staticEmail" value="{{course_data['duration']}}"></p>
        <p><input type="text" readonly class="form-control-plaintext" id="staticEmail" value="{{course_data['level']}}"></p>
        <p><input type="text" readonly class="form-control-plaintext" id="staticEmail" value="{{course_data['instructor_name']}}">Instructor name: </p>
        <p><span>Price:<input type="text" readonly class="form-control-plaintext" id="staticEmail" value="{{course_data['price']}}">Rs.</span></p>
        <form action="{{url_for('course_op')}}" method="post">
        <input type="hidden" readonly class="form-control-plaintext" name ="cid" id="staticEmail" value="{{course_data['id']}}">
        <button type="submit" class="btn btn-warning px-5 mb-2" name="action" value="buy">Buy</button>
        <button type="submit" class="btn btn-warning px-5 mb-2" name="action" value="cart">Cart</button>
        </form>
      </div>
    </div>

  </div>

</div>

{% endblock %}
